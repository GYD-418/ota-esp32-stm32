<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WiFi 配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333}
.container{max-width:420px;margin:0 auto;padding:16px}
h1{text-align:center;margin:20px 0;color:#2c3e50;font-size:1.5em}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;cursor:pointer;text-align:center;transition:all 0.2s}
.btn-primary{background:#4CAF50;color:#fff}
.btn-primary:hover{background:#45a049}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-danger{background:#ff5252;color:#fff}
.btn-danger:hover{background:#d32f2f}
.btn-sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px}
input[type="text"],input[type="password"]{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin:6px 0}
input:focus{outline:none;border-color:#2196F3}
label{font-weight:600;color:#555;font-size:14px;display:block;margin-top:8px}
h3{margin:12px 0 8px;color:#555;font-size:14px}
.ap-list{list-style:none;max-height:250px;overflow-y:auto}
.ap-item{display:flex;align-items:center;padding:10px 12px;margin:4px 0;background:#e8f5e9;border-radius:8px;cursor:pointer;transition:background 0.2s}
.ap-item:hover{background:#c8e6c9}
.ap-name{flex:1;font-weight:500}
.ap-rssi{color:#888;font-size:12px;margin-left:8px}
.ap-lock{margin-left:4px}
.saved-item{display:flex;align-items:center;padding:10px 12px;margin:4px 0;background:#e3f2fd;border-radius:8px}
.saved-name{flex:1;font-weight:500}
.scanning{color:#888;font-style:italic;font-size:13px}
.hidden{display:none}
.loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center}
.loading-overlay.show{display:flex}
.loading-content{display:flex;flex-direction:column;align-items:center;gap:20px}
.loading-spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
.loading-text{color:#fff;font-size:16px;font-weight:bold}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-overlay" id="loading">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在连接...</div>
  </div>
</div>

<div class="container">
<h1>WiFi 配置</h1>

<div class="card hidden" id="savedSection">
  <h3>已保存的WiFi</h3>
  <div id="savedList"></div>
</div>

<div class="card">
  <h3>连接WiFi</h3>
  <form onsubmit="return connectWifi()">
    <label>WiFi名称</label>
    <input type="text" id="ssid" placeholder="点击下方网络列表选择" required readonly>
    <label>WiFi密码</label>
    <input type="password" id="password" placeholder="留空表示无密码">
    <div style="margin-top:12px">
      <button type="submit" class="btn btn-primary" id="btnConnect">连接</button>
    </div>
  </form>
</div>

<div class="card">
  <h3>可用网络 <span id="scanHint" class="scanning">扫描中...</span></h3>
  <ul id="apList" class="ap-list"></ul>
</div>
</div>

<script>
var scanning = false;

function loadSaved() {
  fetch('/saved/list').then(function(r){return r.json()}).then(function(data) {
    var section = document.getElementById('savedSection');
    var list = document.getElementById('savedList');
    if (!data || data.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    list.innerHTML = '';
    data.forEach(function(ssid, i) {
      var div = document.createElement('div');
      div.className = 'saved-item';
      div.innerHTML = '<span class="saved-name">' + escapeHtml(ssid) + '</span>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteSaved(' + i + ')">删除</button>';
      list.appendChild(div);
    });
  }).catch(function(){});
}

function deleteSaved(index) {
  fetch('/saved/delete?index=' + index).then(function(){ loadSaved(); });
}

function scanWifi() {
  if (scanning) return;
  scanning = true;
  document.getElementById('scanHint').textContent = '扫描中...';
  fetch('/scan').then(function(r){return r.json()}).then(function(data) {
    var list = document.getElementById('apList');
    list.innerHTML = '';
    if (!data || data.length === 0) {
      list.innerHTML = '<li class="scanning">未发现网络</li>';
    } else {
      data.forEach(function(ap) {
        var li = document.createElement('li');
        li.className = 'ap-item';
        li.onclick = function(){ document.getElementById('ssid').value = ap.ssid; };
        var lock = ap.auth > 0 ? '🔒' : '🌐';
        li.innerHTML = '<span class="ap-name">' + escapeHtml(ap.ssid) + '</span>' +
          '<span class="ap-rssi">' + ap.rssi + ' dBm</span>' +
          '<span class="ap-lock">' + lock + '</span>';
        list.appendChild(li);
      });
    }
    document.getElementById('scanHint').textContent = '';
    scanning = false;
    setTimeout(scanWifi, 5000);
  }).catch(function(){
    scanning = false;
    document.getElementById('scanHint').textContent = '';
    setTimeout(scanWifi, 5000);
  });
}

function connectWifi() {
  var ssid = document.getElementById('ssid').value;
  var password = document.getElementById('password').value;
  if (!ssid) return false;

  document.getElementById('loading').classList.add('show');
  document.getElementById('btnConnect').disabled = true;

  fetch('/submit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ssid: ssid, password: password})
  }).then(function(r){return r.json()}).then(function(data) {
    if (data.success) {
      window.location.href = '/done.html';
    } else {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('btnConnect').disabled = false;
      alert('连接失败: ' + (data.error || '未知错误'));
    }
  }).catch(function(){
    document.getElementById('loading').classList.remove('show');
    document.getElementById('btnConnect').disabled = false;
    alert('请求失败');
  });
  return false;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadSaved();
scanWifi();
</script>
</body>
</html>
